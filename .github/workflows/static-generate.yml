name: Static Generate

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    env:
      APP_URL: dwselect.applepig.net
      DISQUS_SHORTNAME: dwselect

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Cache 必須在 install 之前 restore：install 的 prepare hook（nuxt prepare）會用當前 commit 重新
      # 生成 .nuxt/components.d.ts 等 auto-import manifest，覆蓋掉 restore 的舊 .nuxt。若 restore 在 install
      # 之後，restore-keys fallback 撈到的舊 .nuxt 會覆寫掉新 manifest，令 knip/typecheck 讀 stale 定義而
      # 對慣例引用（<AppNavigation> 等）誤報 unused（Case 4 在 CI 復活）。node_modules/.cache/nuxt（Vite
      # cache）不受 prepare 影響、續享加速。
      - name: Restore Nuxt build cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.cache/nuxt
            .nuxt
          key: nuxt-build-${{ runner.os }}-node-24-${{ hashFiles('pnpm-lock.yaml', 'nuxt.config.ts', 'app/**', 'scripts/**', 'content/**') }}
          restore-keys: |
            nuxt-build-${{ runner.os }}-node-24-
            nuxt-build-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run lint
        run: pnpm lint

      - name: Run knip
        run: pnpm knip

      - name: Run typecheck
        run: pnpm typecheck

      - name: Generate static site
        env:
          DWSELECT_ALLOW_HOST_GENERATE: "1"
        run: pnpm generate

      - name: Install Chromium for static preview E2E
        run: pnpm exec playwright install --with-deps chromium

      - name: Run static preview E2E
        env:
          PLAYWRIGHT_EXTERNAL_SERVER: "1"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: |
          node --experimental-strip-types scripts/serve-static-output.ts &
          static_preview_pid=$!
          trap 'kill "$static_preview_pid"' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              printf 'Static preview did not become ready.\n' >&2
              exit 1
            fi

            sleep 1
          done

          pnpm test:e2e

      - name: Upload static site artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: .output/public
          if-no-files-found: error
